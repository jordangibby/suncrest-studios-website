<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Client Portal — Suncrest Studios</title>
<style>
:root{--bg:#FAF8F2;--ink:#082029;--gold:#E1A823;--muted:#5B6A6D}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Arial,"Helvetica Neue",sans-serif}
.card{width:min(420px,92vw);background:#fff;border-radius:16px;padding:40px 32px;box-shadow:0 10px 40px rgba(8,32,41,.12);text-align:center}
.eyebrow{font-family:Baskerville,Georgia,serif;font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
h1{font-family:Baskerville,Georgia,serif;font-size:30px;margin:0 0 10px}p{color:var(--muted);margin:0 0 24px;line-height:1.5}
input{width:100%;padding:14px;border:1.5px solid rgba(8,32,41,.2);border-radius:10px;font-size:16px;text-align:center;letter-spacing:.08em;margin-bottom:14px}
input:focus{outline:none;border-color:var(--ink)}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}.err{color:#b3261e;font-size:14px;min-height:20px;margin-top:12px}
a.back{display:inline-block;margin-top:18px;color:var(--muted);font-size:14px;text-decoration:none}
</style></head><body>
<form class="card" id="f">
  <div class="eyebrow">Client Portal</div>
  <h1>Enter your passcode</h1>
  <p>Use the passcode Suncrest Studios sent you to view your proposal.</p>
  <input id="code" type="password" autocomplete="off" placeholder="Passcode" required autofocus>
  <button id="go" type="submit">View proposal</button>
  <div class="err" id="err" role="alert"></div>
  <a class="back" href="/">← Back to site</a>
</form>
<script>
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';go.disabled=true;
  try{
    const r=await fetch('/api/portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value.trim()})});
    if(r.ok){location.href='/api/portal';return}
    err.textContent=r.status===429?'Too many attempts. Try again later.':'That passcode didn’t work. Please check it and try again.';
  }catch(_){err.textContent='Something went wrong. Please try again.'}
  go.disabled=false;
});
</script></body></html>
